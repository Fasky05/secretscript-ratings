name: Count provider rating
on:
  issues:
    types: [opened, edited]
permissions:
  contents: write
  issues: write
concurrency:
  group: ratings
  cancel-in-progress: false
jobs:
  count:
    if: startsWith(github.event.issue.title, '[rating]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record vote
        run: python3 scripts/aggregate.py
      - name: Publish ratings.json
        run: |
          git config user.name "secretscript-ratings"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add votes ratings.json
          if ! git diff --cached --quiet; then
            git commit -m "Rating from issue #$NUM"
            git pull --rebase
            git push
          fi
        env:
          NUM: ${{ github.event.issue.number }}
      - name: Close issue
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUM: ${{ github.event.issue.number }}
        run: |
          MSG="$(cat result.txt 2>/dev/null || echo 'Rating not recorded.')"
          gh issue close "$NUM" --repo "$GITHUB_REPOSITORY" --comment "$MSG"
